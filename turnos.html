    <div class="container mt-4 maincontainer">
        <h2 class="mb-4 titulo-seccion">Gestión de Turnos</h2>
        <div class="row">
            <!-- Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header text-white">Registrar Turno</div>
                    <div class="card-body">
                        <form id="formularioTurno">
                            <div class="mb-3">
                                <label class="form-label">Mascota</label>
                                <select class="form-select" id="mascotaTurno" required>
                                    <option value="">Seleccione una mascota...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Veterinario</label>
                                <select class="form-select" id="veterinarioTurno" required>
                                    <option value="">Seleccione un veterinario...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fechaTurno" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hora</label>
                                <input type="time" class="form-control" id="horaTurno" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Motivo de consulta</label>
                                <input type="text" class="form-control" id="motivoTurno" required>
                            </div>
                            <button type="submit" class="btn boton-guardar w-100">Guardar Turno</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla y Filtros -->
            <div class="col-md-8">
                <div class="card mb-3 p-3 bg-light">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label mb-1">Filtrar por Veterinario</label>
                            <select id="filtroVeterinario" class="form-select form-select-sm">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label mb-1">Filtrar por Fecha</label>
                            <input type="date" id="filtroFecha" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <button id="btnLimpiarFiltros" class="btn btn-secondary btn-sm w-100">Limpiar Filtros</button>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover border">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Mascota</th>
                                <th>Veterinario</th>
                                <th>Motivo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTurnos">
                            <!-- Los datos se cargan desde JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
