<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Veterinaria Ojeto</title>
    <!-----Boostrap----->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-----Iconos----->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-----CSS----->
    <link rel="stylesheet" href="/styles.css">
    <link rel="shortcut icon" href="/assets/images/favicon.png" type="png">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-secondary">
        <div class="container-fluid">
            <a class="navbar-brand nav-image" href="/index.html"><img src="/assets/images/favicon.png" alt="Logo" width="60px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/info.html">Institucional</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contacto.html">Contacto</a>
                    </li>
                    <li class="nav-item nav-admin d-none">
                        <a class="nav-link" href="/veterinarios.html">Adm. Veterinarios</a>
                    </li>
                    <li class="nav-item nav-admin d-none">
                        <a class="nav-link" href="/mascotas.html">Adm. Mascotas</a>
                    </li>
                    <li class="nav-item nav-admin d-none">
                        <a class="nav-link" href="/turnos.html">Adm. Turnos</a>
                    </li>
                    <li class="nav-item nav-admin d-none">
                        <a class="nav-link" href="/historia-clinica.html">Historia Clínica</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="navLogin">
                        <a class="nav-link" href="/login.html">Login</a>
                    </li>
                    <li class="nav-item d-none" id="navLogout">
                        <a class="nav-link text-danger" href="#" id="btnCerrarSesion">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="maincontainer container seccion-espaciada">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header text-white">Iniciar Sesión</div>
                    <div class="card-body">
                        <div id="errorLogin" class="alert alert-danger d-none">
                            Usuario o contraseña incorrectos.
                        </div>
                        <form id="formularioLogin">
                            <div class="mb-3">
                                <label class="form-label" for="username">Usuario</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn boton-guardar w-100">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>
            Veterinaria OJETO - IDW - FCAD UNER 2026
        </p>
    </footer>

    <script src="js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
